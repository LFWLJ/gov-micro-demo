name: build

# ============================================================
# CI：后端构建 + 测试 + 前端构建 + docker-compose 语法校验
#
# 关于测试：
#   - 纯单元测试（JwtUtilTest / DataScopeContextTest / EvaluationServiceTest /
#     LicensePdfUtilTest / FileFeignClientFallbackFactoryTest）不依赖中间件，CI 上全跑。
#   - 4 个 *ApplicationTests 是 @SpringBootTest 上下文冒烟测试，需要 Nacos(8848) 等中间件。
#     它们会**先探测端口，连不上就跳过**，所以 CI runner 上没有中间件也能绿；
#     本地 docker compose up -d 后会自动真正执行（本地 25 个用例，CI 21 个）。
#   - 因此这里用严格的 `mvn verify`，不需要 -DskipTests 之类的绕过。
#
# gov-api 是纯契约库（无 @SpringBootApplication），不能放 @SpringBootTest，
# 该模块的测试已改为普通 JUnit 测试（FileFeignClientFallbackFactoryTest）。
# ============================================================

on:
  push:
  pull_request:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================
  # 1. 后端：编译 + 打包 + 测试
  # ==========================================================
  backend:
    name: backend (maven verify)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 (temurin) + maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: mvn verify
        run: mvn -B -ntp verify

      - name: Surefire summary
        if: always()
        run: |
          echo "---------- surefire 结果汇总 ----------"
          grep -rH 'Tests run' --include='*.txt' ./*/target/surefire-reports/ || true

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/**"
          if-no-files-found: ignore

  # ==========================================================
  # 2. 前端：npm ci + 构建
  # ==========================================================
  frontend:
    name: frontend (npm build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gov-admin-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20 + npm cache
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: gov-admin-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  # ==========================================================
  # 3. docker-compose 语法校验（轻量，不启动任何容器）
  # ==========================================================
  compose-config:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # .env 被 .gitignore 排除，CI 里不存在；compose 引用的一堆变量会变成
      # "variable is not set" 警告。这里生成占位 .env，仅用于语法校验。
      # 注意 NACOS_AUTH_TOKEN 必须 >= 32 字节（base64），否则 Nacos 会拒绝启动。
      - name: Create dummy .env for syntax validation
        run: |
          cat > .env <<'EOF'
          MYSQL_ROOT_PASSWORD=ci_dummy_mysql_password
          MYSQL_DATABASE=gov_db
          NACOS_USERNAME=nacos
          NACOS_PASSWORD=ci_dummy_nacos_password
          NACOS_AUTH_TOKEN=Y2lfZHVtbXlfdG9rZW5fbXVzdF9iZV9sb25nX2Vub3VnaF9mb3JuYWNvcw==
          NACOS_AUTH_IDENTITY_KEY=serverIdentity
          NACOS_AUTH_IDENTITY_VALUE=security
          REDIS_PASSWORD=ci_dummy_redis_password
          MINIO_ROOT_USER=minioadmin
          MINIO_ROOT_PASSWORD=ci_dummy_minio_password
          GOV_JWT_SECRET=ci_dummy_jwt_secret_must_be_long_enough_for_hs256
          EOF

      - name: Validate compose syntax
        run: docker compose config -q

      - name: Show resolved compose (debug)
        run: |
          docker compose config > /tmp/compose-resolved.yaml
          wc -l /tmp/compose-resolved.yaml
