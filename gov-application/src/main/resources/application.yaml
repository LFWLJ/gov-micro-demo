server:
  port: 8082

spring:
  application:
    name: gov-application
  datasource:
    url: ${GOV_DB_URL:jdbc:mysql://127.0.0.1:3306/gov_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true}
    username: ${GOV_DB_USERNAME:root}
    password: ${GOV_DB_PASSWORD:root123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 2
      maximum-pool-size: 10
      connection-timeout: 30000
  cloud:
    nacos:
      discovery:
        server-addr: ${GOV_NACOS_ADDR:127.0.0.1:8848}
        username: ${GOV_NACOS_USERNAME:nacos}
        password: ${GOV_NACOS_PASSWORD:7PkhQ0b92nUU}
  data:
    redis:
      host: ${GOV_REDIS_HOST:127.0.0.1}
      port: ${GOV_REDIS_PORT:6379}
      password: ${GOV_REDIS_PASSWORD:}
      database: 0
      timeout: 3000ms

rocketmq:
  name-server: ${GOV_ROCKETMQ_ADDR:127.0.0.1:9876}
  producer:
    group: gov-application-producer
    send-message-timeout: 3000

# Flowable 配置
flowable:
  database-schema-update: true
  async-executor-activate: false
  history-level: full
  process:
    definition-cache-limit: 100

# MyBatis-Plus
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

# MinIO 不需要（那是 gov-file 的配置）

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

knife4j:
  enable: true
  setting:
    language: zh_cn