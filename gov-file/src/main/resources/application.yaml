server:
  port: 8083

spring:
  application:
    name: gov-file
  datasource:
    url: ${GOV_DB_URL:jdbc:mysql://127.0.0.1:3306/gov_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${GOV_DB_USERNAME:root}
    password: ${GOV_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  cloud:
    nacos:
      discovery:
        server-addr: ${GOV_NACOS_ADDR:127.0.0.1:8848}
        username: ${GOV_NACOS_USERNAME:nacos}
        password: ${GOV_NACOS_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB
  data:
    redis:
      host: ${GOV_REDIS_HOST:127.0.0.1}
      port: ${GOV_REDIS_PORT:6379}
      password: ${GOV_REDIS_PASSWORD:}

minio:
  endpoint: ${GOV_MINIO_ENDPOINT:http://127.0.0.1:9000}
  access-key: ${GOV_MINIO_ACCESS:}
  secret-key: ${GOV_MINIO_SECRET:}
  bucket: ${GOV_MINIO_BUCKET:gov-files}
  presigned-expiry: 3600

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-}, tenant=%X{tenantId:-}] %logger{36} - %msg%n"
  level:
    com.gov: info

gov:
  jwt:
    # 与网关、gov-auth 共用的同一个密钥；为空时 JwtIdentityFilter 自动不生效
    secret: ${GOV_JWT_SECRET:}
  auth:
    # 兜底：没有网关注入的 X-User-Id 时，服务自己校验 JWT 并推导身份。
    # 用途——接口文档页（Knife4j）的调试请求会直连服务端口，不带网关身份，
    # 开了它「填了 token 就能调」；生产环境若只允许经网关访问，可设为 false。
    jwt-fallback-enabled: true

# Actuator：仅暴露 health/info，供 Docker healthcheck 探活使用
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # 不向未认证调用方泄露数据库/MinIO 等组件细节
      show-details: never
