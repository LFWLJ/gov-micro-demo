server:
  port: 8090
spring:
  application:
    name: gov-gateway
    main:
      web-application-type: reactive
  config:
    import:
      - optional:nacos:gateway-routes.yaml
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
  cloud:
    nacos:
      discovery:
        server-addr: ${GOV_NACOS_ADDR:127.0.0.1:8848}
        username: ${GOV_NACOS_USERNAME:nacos}
        password: ${GOV_NACOS_PASSWORD:}
      config:
        server-addr: ${GOV_NACOS_ADDR:127.0.0.1:8848}
        username: ${GOV_NACOS_USERNAME:nacos}
        password: ${GOV_NACOS_PASSWORD:}
        file-extension: yaml
        refresh-enabled: true
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
  data:
    redis:
      host: ${GOV_REDIS_HOST:127.0.0.1}
      port: ${GOV_REDIS_PORT:6379}
      password: ${GOV_REDIS_PASSWORD:}
gov:
  jwt:
    secret: ${GOV_JWT_SECRET:}
gateway:
  auth:
    white-list:
      - /api/auth/login
      - /api/license/verify/**

# Actuator：仅暴露 health/info，供 Docker healthcheck 探活使用
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # 不向未认证调用方泄露组件细节
      show-details: never
