services:
  # ============================================================
  # 基础设施
  # ============================================================
  mysql:
    image: mysql:8.0
    container_name: gov-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-authentication-plugin=mysql_native_password
      - --lower_case_table_names=1
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks:
      - gov-net

  redis:
    image: redis:7-alpine
    container_name: gov-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - gov-net

  minio:
    image: pgsty/silo:latest
    container_name: gov-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gov-net

  minio-init:
    image: pgsty/silo:latest
    container_name: gov-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing myminio/gov-files;
      mc anonymous set download myminio/gov-files;
      exit 0;
      "
    networks:
      - gov-net

  rocketmq-namesrv:
    image: apache/rocketmq:5.3.1
    container_name: gov-rocketmq-namesrv
    restart: unless-stopped
    ports:
      - "9876:9876"
    environment:
      JAVA_OPT_EXT: "-Xms128m -Xmx256m -Xmn128m"
    command: sh mqnamesrv
    volumes:
      - rocketmq-namesrv-logs:/home/rocketmq/logs
    networks:
      - gov-net

  rocketmq-broker:
    image: apache/rocketmq:5.3.1
    container_name: gov-rocketmq-broker
    restart: unless-stopped
    user: root
    depends_on:
      - rocketmq-namesrv
    ports:
      - "10909:10909"
      - "10911:10911"
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
      JAVA_OPT_EXT: "-Xms256m -Xmx512m -Xmn256m"
    volumes:
      - ./docker/rocketmq/broker.conf:/home/rocketmq/rocketmq-5.3.1/conf/broker.conf:ro
      - rocketmq-broker-store:/home/rocketmq/store
      - rocketmq-broker-logs:/home/rocketmq/logs
    command: sh mqbroker -c /home/rocketmq/rocketmq-5.3.1/conf/broker.conf
    networks:
      - gov-net

  nacos:
    image: nacos/nacos-server:v3.2.4
    container_name: gov-nacos
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MODE: standalone
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_DB_NAME: nacos_config
      MYSQL_SERVICE_USER: root
      MYSQL_SERVICE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_SERVICE_DB_PARAM: "characterEncoding=utf8&connectTimeout=10000&socketTimeout=30000&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai"
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE}
      NACOS_AUTH_TOKEN_EXPIRE_SECONDS: "18000"
      JVM_XMS: 256m
      JVM_XMX: 512m
    ports:
      - "8848:8848"
      - "9848:9848"
      - "8080:8080"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8848/nacos/v3/admin/core/state/readiness" ]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - gov-net

  # ============================================================
  # Java 服务
  # ============================================================
  gov-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: gov-gateway
    container_name: gov-gateway
    restart: unless-stopped
    depends_on:
      nacos:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      GOV_NACOS_ADDR: nacos:8848
      GOV_NACOS_USERNAME: ${NACOS_USERNAME}
      GOV_NACOS_PASSWORD: ${NACOS_PASSWORD}
      GOV_REDIS_HOST: redis
      GOV_REDIS_PORT: 6379
      GOV_JWT_SECRET: ${GOV_JWT_SECRET}
      JAVA_OPTS: "-Xms256m -Xmx512m -Dfile.encoding=UTF-8"
    ports:
      - "8090:8090"
    networks:
      - gov-net

  gov-auth:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: gov-auth
    container_name: gov-auth
    restart: unless-stopped
    depends_on:
      nacos:
        condition: service_healthy
      mysql:
        condition: service_healthy
    environment:
      GOV_DB_URL: "jdbc:mysql://mysql:3306/gov_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
      GOV_DB_USERNAME: root
      GOV_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      GOV_NACOS_ADDR: nacos:8848
      GOV_NACOS_USERNAME: ${NACOS_USERNAME}
      GOV_NACOS_PASSWORD: ${NACOS_PASSWORD}
      GOV_REDIS_HOST: redis
      GOV_REDIS_PORT: 6379
      GOV_JWT_SECRET: ${GOV_JWT_SECRET}
      JAVA_OPTS: "-Xms256m -Xmx512m -Dfile.encoding=UTF-8"
    ports:
      - "8081:8081"
    networks:
      - gov-net

  gov-application:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: gov-application
    container_name: gov-application
    restart: unless-stopped
    depends_on:
      nacos:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rocketmq-namesrv:
        condition: service_started
    environment:
      GOV_DB_URL: "jdbc:mysql://mysql:3306/gov_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true"
      GOV_DB_USERNAME: root
      GOV_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      GOV_NACOS_ADDR: nacos:8848
      GOV_NACOS_USERNAME: ${NACOS_USERNAME}
      GOV_NACOS_PASSWORD: ${NACOS_PASSWORD}
      GOV_REDIS_HOST: redis
      GOV_REDIS_PORT: 6379
      GOV_ROCKETMQ_ADDR: rocketmq-namesrv:9876
      JAVA_OPTS: "-Xms384m -Xmx768m -Dfile.encoding=UTF-8"
    ports:
      - "8082:8082"
    networks:
      - gov-net

  gov-file:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: gov-file
    container_name: gov-file
    restart: unless-stopped
    depends_on:
      nacos:
        condition: service_healthy
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      GOV_DB_URL: "jdbc:mysql://mysql:3306/gov_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
      GOV_DB_USERNAME: root
      GOV_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      GOV_NACOS_ADDR: nacos:8848
      GOV_NACOS_USERNAME: ${NACOS_USERNAME}
      GOV_NACOS_PASSWORD: ${NACOS_PASSWORD}
      GOV_REDIS_HOST: redis
      GOV_REDIS_PORT: 6379
      GOV_MINIO_ENDPOINT: http://minio:9000
      GOV_MINIO_ACCESS: ${MINIO_ROOT_USER}
      GOV_MINIO_SECRET: ${MINIO_ROOT_PASSWORD}
      GOV_MINIO_BUCKET: gov-files
      JAVA_OPTS: "-Xms256m -Xmx512m -Dfile.encoding=UTF-8"
    ports:
      - "8083:8083"
    networks:
      - gov-net

  # ============================================================
  # 前端
  # ============================================================
  gov-admin-web:
    build:
      context: ./gov-admin-web
      dockerfile: Dockerfile
    container_name: gov-admin-web
    restart: unless-stopped
    depends_on:
      - gov-gateway
    ports:
      - "80:80"
    networks:
      - gov-net

volumes:
  mysql-data:
  redis-data:
  minio-data:
  rocketmq-namesrv-logs:
  rocketmq-broker-store:
  rocketmq-broker-logs:

networks:
  gov-net:
    driver: bridge